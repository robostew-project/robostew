# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Namespace
metadata:
  name: robostew-observer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robostew-observer
  namespace: robostew-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: robostew-observer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: robostew-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: robostew-observer
subjects:
  - kind: ServiceAccount
    name: robostew-observer
    namespace: robostew-observer
