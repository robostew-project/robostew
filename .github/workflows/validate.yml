# SPDX-License-Identifier: Apache-2.0
name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Unit tests
        run: node --test local/tests/*.test.mjs
      - name: Reference tests
        run: find reference -name '*.test.mjs' -exec node --test {} +
      - name: Shell syntax
        run: sh -n robostew scripts/validate_local_release.sh scripts/audit_public_snapshot.sh
      - name: Compose configuration
        run: docker compose --file compose.yaml config --quiet
      - name: Publication audit
        run: ROBOSTEW_ALLOW_PUBLIC_GIT=1 ./scripts/audit_public_snapshot.sh .
      - name: Markdown links
        run: node scripts/check_markdown_links.mjs .
      - name: Build local image
        run: docker build --file Dockerfile.local --tag robostew-ci:0.2.0-dev .
      - name: Scan source, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-dirs: .git
          timeout: 10m
      - name: Scan local container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: robostew-ci:0.2.0-dev
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          timeout: 10m
      - name: Scan pinned state-store image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          timeout: 10m
